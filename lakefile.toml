name = "nth_order_spr"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SPR"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "SPR"
srcDir = "Lean"
roots = ["SPR", "Main", "Audit", "Verify"]
globs = ["SPR", "Main", "Audit", "Verify", "SPR.+"]
